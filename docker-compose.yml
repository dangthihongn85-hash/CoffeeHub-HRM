version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: hrm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hrm_db
      MYSQL_USER: hrm
      MYSQL_PASSWORD: hrm
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
