version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: hrm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hrm_db
      MYSQL_USER: hrm
      MYSQL_PASSWORD: hrm
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  backend:
    build:
      context: ./hrm-backend
      dockerfile: Dockerfile
    container_name: hrm-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hrm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    depends_on:
      - mysql
    restart: unless-stopped

  frontend:
    build:
      context: ./hrm-frontend
      dockerfile: Dockerfile
    container_name: hrm-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
